<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>keymeter</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- web fonts load without blocking the first paint (a network that drops the request stalls nothing); system fonts until then -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="/styles.css">
<script>
  // apply a saved theme before first paint
  try { var t = localStorage.getItem('keymeter-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<!-- Lucide icons (ISC), referenced with <use href="#i-name"> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></symbol>
  <symbol id="i-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-triangle-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-octagon-x" viewBox="0 0 24 24"><path d="m15 9-6 6"/><path d="M2.586 16.726A2 2 0 0 1 2 15.312V8.688a2 2 0 0 1 .586-1.414l4.688-4.688A2 2 0 0 1 8.688 2h6.624a2 2 0 0 1 1.414.586l4.688 4.688A2 2 0 0 1 22 8.688v6.624a2 2 0 0 1-.586 1.414l-4.688 4.688a2 2 0 0 1-1.414.586H8.688a2 2 0 0 1-1.414-.586z"/><path d="m9 9 6 6"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
  <symbol id="i-loader" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></symbol>
  <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></symbol>
  <symbol id="i-unplug" viewBox="0 0 24 24"><path d="m19 5 3-3"/><path d="m2 22 3-3"/><path d="M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z"/><path d="M7.5 13.5 10 11"/><path d="M10.5 16.5 13 14"/><path d="m12 6 6 6 2.3-2.3a2.4 2.4 0 0 0 0-3.4l-2.6-2.6a2.4 2.4 0 0 0-3.4 0Z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
  <symbol id="i-bell-off" viewBox="0 0 24 24"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/></symbol>
  <symbol id="i-chart-line" viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></symbol>
</svg>

<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><svg class="i" aria-hidden="true"><use href="#i-gauge"/></svg></div>
      <div class="brand-text">
        <h1>keymeter</h1>
        <p class="ident" id="ident">connecting…</p>
      </div>
    </div>
    <div class="controls">
      <span id="status-slot"></span>
      <span class="live" id="live" data-state="polling"><span class="live-dot" aria-hidden="true"></span><span id="live-text">Connecting…</span></span>
      <button class="btn" id="poll-now" type="button"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg><span>Poll now</span></button>
      <button class="btn icon-btn" id="alerts-btn" type="button" aria-pressed="false"></button>
      <button class="btn icon-btn" id="theme-btn" type="button"></button>
    </div>
  </header>

  <main>
    <div id="banner" hidden></div>

    <section class="card empty" id="empty" hidden></section>

    <div id="dash" hidden>
      <section class="kpis" id="kpis" aria-label="Budget overview"></section>

      <div class="grid two">
        <section class="card">
          <div class="card-head"><div><h2 class="card-title">Burn rate &amp; projections</h2><p class="card-sub" id="proj-sub"></p></div></div>
          <div class="table-wrap" id="proj"></div>
        </section>
        <section class="card">
          <div class="card-head"><div><h2 class="card-title">Limits</h2><p class="card-sub" id="limits-sub"></p></div></div>
          <div id="limits"></div>
        </section>
      </div>

      <div class="filter-row">
        <span class="filter-label" id="range-label">History</span>
        <div class="seg" id="range" role="group" aria-labelledby="range-label"></div>
        <span class="filter-note" id="range-note"></span>
      </div>
      <div class="grid two" id="charts"></div>

      <section class="card section" id="models-card">
        <div class="card-head"><div><h2 class="card-title">Spend by model</h2><p class="card-sub">This key, all time and this session</p></div></div>
        <div class="table-wrap" id="models"></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head"><div><h2 class="card-title">Events</h2><p class="card-sub">Status changes, thresholds and resets, newest first</p></div></div>
      <ul class="events" id="events"></ul>
    </section>
  </main>

  <footer class="foot" id="foot"></footer>
</div>
<script src="/app.js"></script>
</body>
</html>
