name: Release

# Push a tag like v0.1.0 to build the package and publish it to PyPI.
# Publishing uses PyPI trusted publishing, so no API token is stored in the repository.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked pytest
      - run: uv build
      - name: Check the tag matches the package version
        run: test -f "dist/keymeter-${GITHUB_REF_NAME#v}.tar.gz" || { echo "tag $GITHUB_REF_NAME does not match the version in src/keymeter/__init__.py"; ls dist; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/keymeter
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
