[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "keymeter"
dynamic = ["version"]
description = "Live spend, budget and burn-rate dashboard for one LiteLLM or OpenRouter API key, in the browser or the terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Do Pham Bao Hoang" }]
requires-python = ">=3.10"
dependencies = ["rich>=13"]
keywords = ["litellm", "openrouter", "llm", "api-key", "budget", "quota", "spend", "dashboard", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/hoanghero125/keymeter"
Issues = "https://github.com/hoanghero125/keymeter/issues"
Changelog = "https://github.com/hoanghero125/keymeter/blob/main/CHANGELOG.md"

[project.scripts]
keymeter = "keymeter.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "src/keymeter/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
